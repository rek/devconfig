# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Pyprland — scratchpad daemon for dropdown terminal (bound to F13 via keyd)
exec-once = uwsm-app -- pypr

# Work environment — landed onto workspaces via windowrules.conf
exec-once = uwsm-app -- vivaldi
exec-once = uwsm-app -- google-chrome-stable
exec-once = uwsm-app -- alacritty

# Sci-fi stats HUD on the laptop monitor (RAM + DL on the background layer)
exec-once = uwsm-app -- eww daemon
exec-once = sleep 1 && eww open-many stats-hud claude-hud launcher-hud
