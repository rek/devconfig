# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Pyprland — scratchpad daemon for dropdown terminal (bound to F13 via keyd)
exec-once = uwsm-app -- pypr

# Mode-specific app launches live in ~/.config/hypr/modes/<mode>.conf,
# selected via the `mode` command.

# Sci-fi stats HUD on the laptop monitor (RAM + DL on the background layer)
exec-once = uwsm-app -- eww daemon
exec-once = sleep 1 && eww open-many stats-hud claude-hud launcher-hud top-hud
# pr-hud is work-mode only — open it at startup only if the current mode is work.
exec-once = sleep 2 && test "$(~/.config/eww/scripts/mode-state.sh)" = work && eww open pr-hud
