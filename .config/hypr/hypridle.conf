general {
    lock_cmd = omarchy-system-lock                         # lock screen and 1password
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after 10 minutes of idle.
# Uses our synced launcher (scripts/omarchy-screensaver-synced.sh) instead of
# upstream omarchy-launch-screensaver — picks ONE random tte effect per
# session and uses it on every monitor, so they all match.
listener {
    timeout = 600
    on-timeout = pidof hyprlock || $HOME/dev/devconfig/scripts/omarchy-screensaver-synced.sh
}

# Lock 2s after the screensaver. hypridle listeners are independent timers
# from last input, so this is "10 min + 2s of total idle", not "screensaver
# fires + 2s later".
listener {
    timeout = 602
    on-timeout = omarchy-system-lock
    on-resume = omarchy-system-wake
}
