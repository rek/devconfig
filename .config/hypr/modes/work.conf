# Work mode: desk display layout + work app placement.
# Switch via `mode work`. Loaded through ~/.config/hypr/modes/current.conf.

# Per-class workspace placement. `workspace` is a static effect — it matches
# the window's initialClass at launch, not the live class after the page loads.
windowrule = workspace 2 silent, match:class ^(Alacritty|ghostty)$
windowrule = workspace 3 silent, match:class ^(vivaldi-stable|google-chrome)$

# Apps that should be running in work mode. exec-once only fires at Hyprland
# startup; `mode work` also launches missing apps live via hyprctl.
exec-once = uwsm-app -- vivaldi
exec-once = uwsm-app -- google-chrome-stable
exec-once = uwsm-app -- alacritty
