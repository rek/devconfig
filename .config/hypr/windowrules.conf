# Workspace → monitor bindings + per-class launch placement.
# Monitor names assume desk mode (laptop + Philips + Acer). Lines for
# absent monitors are silently ignored, so this is safe across modes.

workspace = 1, monitor:eDP-2, default:true
workspace = 2, monitor:DP-2,  default:true
workspace = 3, monitor:DP-1,  default:true

# Launch placement. `workspace` is a static effect, so it matches the
# window's initialClass — not the live class/title after page load.
windowrule = workspace 2 silent, match:class ^(vivaldi-stable|google-chrome)$
windowrule = workspace 3 silent, match:class ^(Alacritty|ghostty)$

