# Workspace → monitor bindings + per-class launch placement.
# Monitor names assume desk mode (laptop + Philips + Acer). Lines for
# absent monitors are silently ignored, so this is safe across modes.

workspace = 1, monitor:eDP-2, default:true
workspace = 2, monitor:DP-2,  default:true
workspace = 3, monitor:DP-1,  default:true

# Per-class launch placement lives in ~/.config/hypr/modes/<mode>.conf,
# selected via the `mode` command. Add only mode-agnostic rules below.

# Pyprland dropdown terminal: force it floating so the scratchpad shows as an
# overlay instead of tiling into the layout. pyprland normally floats it
# itself, but that regressed (Hyprland now spawns the special-workspace window
# tiled), so pin it here.
windowrule = float on, match:class ^(dropdown\.term)$

