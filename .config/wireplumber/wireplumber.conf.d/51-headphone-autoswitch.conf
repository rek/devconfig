## SOF HDA DSP (MSI Vector 16 HX) jack detection is broken — the Headphones
## profile always shows as "not available" even when plugged in. Setting
## api.acp.auto-profile = false makes WirePlumber honour its saved state
## (~/.local/state/wireplumber/default-profile) instead of falling back to
## the highest-priority *available* profile (Speaker).
##
## 2026-07-05: The forced Headphones profile is now BROKEN — since the
## kernel 7.0.9 / sof-firmware update, its Headphones sink maps to card1
## PCM device 6 (alsa:acp:sofhdadsp:6:playback), which no longer exists as
## a playback device (aplay -l shows only 0, 3, 4, 5, 31). With that
## profile active no sink can ever start, all streams fail with "no target
## node available", and PulseAudio clients hang (Blender froze at startup
## with no window). Pinning the working Speaker profile instead; jack
## auto-port switching (api.acp.auto-port) still handles headphones if the
## kernel ever exposes the jack again. Revisit after kernel/sof-firmware
## updates: check `pactl list cards` — if the Headphones profile shows
## "available: yes" and its PCM exists, it can be restored here.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_80_1f.3-platform-skl_hda_dsp_generic"
      }
    ]
    actions = {
      update-props = {
        api.acp.auto-port    = true
        api.acp.auto-profile = false
        device.profile       = "HiFi (HDMI1, HDMI2, HDMI3, Mic1, Mic2, Speaker)"
        ## Software volume/mute: PipeWire leaves the ALSA mixer alone, so the
        ## headphone-toggle.sh script owns the Speaker/Headphone switches and
        ## the volume slider works for whichever output is active.
        api.alsa.soft-mixer  = true
      }
    }
  }
]
