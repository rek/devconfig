## Keep Bluetooth headsets in A2DP (stereo, 48kHz) at all times.
##
## Default WirePlumber behavior is to switch a connected BT headset to HFP
## (Hands-Free Profile, mono 16kHz with mic) whenever any app opens a
## recording stream — which silently downgrades music quality and also
## changes the system mic to the BT mic. Disabling autoswitch keeps the
## headset as a stereo output and leaves the default mic (built-in or USB)
## untouched. Toggle to HFP manually if you ever need the BT mic:
##   pactl set-card-profile bluez_card.<MAC> headset-head-unit

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
