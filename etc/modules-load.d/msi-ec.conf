# Load the MSI embedded-controller driver (AUR: msi-ec-dkms-git) at boot.
# Exposes /sys/devices/platform/msi-ec/{fan_mode,cooler_boost,shift_mode,...}
# for real fan-curve/cooler-boost control, which stock msi_wmi_platform ACPI
# doesn't provide. See devconfig memory: project-thermal-spike-unresolved.
msi-ec
