# Cap dirty page cache to fixed sizes to avoid multi-second writeback stalls
# on large-RAM systems with USB-attached SSDs (e.g. Steam library on T7).
# Defaults of 10%/20% of RAM let ~12 GB of dirty pages buffer on a 62 GB box,
# producing 20+ s stalls when flushing to a USB SSD.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
